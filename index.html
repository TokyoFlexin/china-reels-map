<style>
  :root{
    --bg:#bd2a1e;
    --bg-deep:#a12318;
    --ink:#20140f;
    --cream:#f4e9d2;
    --cream-dim:#e8d9ba;
    --muted:#8a6a4a;
    --muted-on-red:#e8c9ae;
    --gold:#e8b923;
    --line:#20140f;
    --line-on-cream:#20140f33;
    --danger:#7a1810;
    --head-font:'Staatliches',cursive;
    --body-font:'Overpass',sans-serif;
    --mono-font:'Overpass Mono',monospace;
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:var(--body-font);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; }
  a{ color:inherit; }

  #app{
    height:100dvh;
    display:flex;
    flex-direction:column;
  }

  /* ---------------- topbar ---------------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 18px;
    border-bottom:2px solid var(--ink);
    flex-shrink:0;
    background:var(--bg);
  }
  .wordmark{
    font-family:var(--head-font);
    font-weight:400;
    font-size:20px;
    letter-spacing:.03em;
    color:var(--cream);
    white-space:nowrap;
    text-transform:uppercase;
  }
  .wordmark .accent{ color:var(--gold); }
  .pastebox{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    border:2px solid var(--ink);
    background:var(--cream);
    padding:8px 12px;
    max-width:420px;
    min-width:0;
  }
  .pastebox input{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    color:var(--ink);
    font-size:13px;
    outline:none;
  }
  .pastebox input::placeholder{ color:var(--muted); }
  .btn{
    font-family:var(--mono-font);
    font-weight:700;
    font-size:11.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    border:2px solid var(--ink);
    background:var(--gold);
    color:var(--ink);
    padding:8px 14px;
    white-space:nowrap;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn:active{ filter:brightness(.96); }
  .btn-ghost{
    background:transparent;
    color:var(--cream);
    border-color:var(--cream);
  }
  .btn-ghost:hover{ background:#ffffff14; }
  .icon-btn{
    border:2px solid var(--ink);
    background:transparent;
    color:var(--cream);
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .icon-btn:hover{ background:#ffffff14; }
  .menu-dropdown{
    position:absolute;
    top:44px;
    right:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    background:var(--cream);
    border:2px solid var(--ink);
    min-width:150px;
  }
  .menu-dropdown button{
    font-family:var(--mono-font);
    font-weight:700;
    font-size:11px;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink);
    background:none;
    border:none;
    text-align:left;
    padding:10px 12px;
  }
  .menu-dropdown button:hover{ background:var(--gold); }
  .menu-dropdown button + button{ border-top:1.5px dashed var(--ink); }

  /* ---------------- filters ---------------- */
  .filters{
    display:flex;
    gap:16px;
    padding:10px 18px;
    border-bottom:2px solid var(--ink);
    flex-shrink:0;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{ display:none; }
  .filter-group{ display:flex; gap:6px; flex-shrink:0; }

    gap:6px;
    font-family:var(--mono-font);
    font-weight:600;
    font-size:10.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:6px 10px;
    border:2px solid transparent;
    background:transparent;
    color:var(--muted-on-red);
    white-space:nowrap;
  }

    border-color:var(--cream);
  }

    display:flex;
    min-height:0;
    position:relative;
  }

  /* ---------------- add/edit form ---------------- */
  #addForm{

  /* ---------------- map ---------------- */
  .maparea{ position:relative; flex:1; min-width:0; }

  .reset-btn{
    position:absolute;

  }

  .pin-icon{
    display:flex; align-items:center; justify-content:center;
  }
  .pin-shape{
    width:18px; height:18px;
    background:var(--ink);

    box-shadow:0 1px 3px rgba(0,0,0,.4);

  .pin-shape.is-selected{ background:var(--gold); }
  .shape-circle{ border-radius:50%; }

  .shape-triangle{ width:0;height:0;background:none !important;border:none !important; border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:17px solid var(--ink); filter:drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
  .shape-triangle.is-selected{ border-bottom-color:var(--gold); }
  .shape-tridown{ width:0;height:0;background:none !important;border:none !important; border-left:10px solid transparent;border-right:10px solid transparent;border-top:17px solid var(--ink); filter:drop-shadow(0 1px 2px rgba(0,0,0,.4)); }
  .shape-tridown.is-selected{ border-top-color:var(--gold); }
  .shape-hexagon{ clip-path:polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%); }

  .temp-pin{
    width:22px;height:22px;border-radius:50%;
    background:var(--gold);
    border:3px solid var(--ink);

  .city-label-icon{ position:relative; }
  .city-tag{
    position:absolute;
    left:0; top:0;

    background:var(--cream);

  .city-tag::after{
    content:'';
    position:absolute;
    left:50%; bottom:-7px;
    transform:translateX(-50%);
    width:0; height:0;

    font-size:9.5px;

  .close-x{
    position:absolute; top:8px; right:8px;

    .topbar{ padding:10px 12px; gap:8px; }

</style>

<div id="app">

  <header class="topbar">
    <div class="wordmark">China Reels <span class="accent">Map</span></div>
    <div class="pastebox">
      <input id="quickPaste" type="text" placeholder="paste a reel link, or type a place…" />
    </div>
    <button class="btn" id="openAddBtn">Punch a ticket →</button>
    <div style="position:relative;">
      <button class="icon-btn" id="menuBtn" title="Export / Import" aria-label="Export or import data">⋮</button>
      <div id="menuDropdown" class="menu-dropdown" hidden>
        <button type="button" id="exportBtn">Export JSON</button>

    </div>

  <div class="filters">

    <aside id="sidebar">

      <div class="sidebar-head" id="formHead" hidden>

      <form id="addForm" hidden>

        </div>

        <p class="geo-status" id="geoStatus"></p>
        <div id="geoResults"></div>

        <div class="field">
          <label for="f_nameLocal">Local name (中文)</label>
          <input type="text" id="f_nameLocal" placeholder="小杨生煎">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f_category">Category</label>
            <select id="f_category"></select>

            <datalist id="cityOptions"></datalist>

        <div class="field">

        </div>
        <div class="field">
          <label for="f_notes">Notes</label>
          <textarea id="f_notes" placeholder="fills from Wikipedia for well-known spots — otherwise, what to get, when to go, anything you'd forget"></textarea>
        </div>
        <div class="field">
          <label for="f_tags">Tags (comma separated)</label>
          <input type="text" id="f_tags" placeholder="dumplings, cheap eats">

        <div class="form-actions">
          <button type="submit" class="btn" id="saveBtn">Stamp it</button>

        </div>
      </form>
    </aside>

    <main class="maparea">

      <button class="reset-btn" id="resetViewBtn">Whole trip</button>

      <div id="infoCard" hidden>

        <p class="iname" id="ic_name"></p>
        <p class="ilocal" id="ic_local"></p>
        <div class="tagrow" id="ic_tags"></div>

          <p class="addr-text" id="ic_address"></p>

            <button class="copy-btn" id="ic_copy">Copy address</button>

        <div class="card-foot">

      <div class="mobile-fab-row">

        <button class="btn" id="mobileAddBtn">+ Add</button>

  </div>
</div>

<div id="toast"></div>

<!-- self-hosted: jsDelivr/unpkg are unreliable behind the GFW, and this site's
     whole job is to work in China. sha256 of vendor/leaflet.js verified
     identical to the CDN copy that used to load here. -->
<script src="vendor/leaflet.js"></script>
<script>
(function(){
  "use strict";

  /* ============ config ============ */
  var CATEGORIES = [
    { id:'sight',    label:'Sight',    shape:'circle' },
    { id:'food',     label:'Food',     shape:'square' },
    { id:'shopping', label:'Shopping', shape:'diamond' },
    { id:'nature',   label:'Nature',   shape:'triangle' },
    { id:'cafe',     label:'Cafe',     shape:'hexagon' },
    { id:'bar',      label:'Bar',      shape:'tridown' },
    { id:'other',    label:'Other',    shape:'ring' }
  ];
  var CATEGORY_MAP = {};
  CATEGORIES.forEach(function(c){ CATEGORY_MAP[c.id] = c; });

  /* The trip's cities, in the order they're visited — this only fixes the
     ORDER of known cities and their map centers. The live city list comes
     from the data (see cities()), so typing a new one into the add form is
     all it takes to add it; Xi'an is pre-seeded with a center so its first
     pin gets a properly placed label rather than a centroid guess. */
  var CITY_ORDER = ['Shanghai','Chongqing','Zhangjiajie','Beijing',"Xi'an"];
  var CITY_CENTERS = {
    /* `dir` splays each tag a different way off its point — at the idle
       China zoom Chongqing/Zhangjiajie/Shanghai sit close enough that
       four tags all drawn upward overlap into an unreadable stack. */
    Shanghai:    { lat:31.2304, lng:121.4737, dir:'up'    },
    Chongqing:   { lat:29.5630, lng:106.5516, dir:'left'  },
    Zhangjiajie: { lat:29.1170, lng:110.4790, dir:'down'  },
    Beijing:     { lat:39.9042, lng:116.4074, dir:'up'    },
    "Xi'an":     { lat:34.3416, lng:108.9398, dir:'up'    }
  };

  /* Every city that actually has a pin, trip cities first, then any others
     alphabetically. Drives the filter chips, the list grouping and the
     city labels — so none of them need touching to add a city. */
  function cities(){
    var seen = {};
    (state.places || []).forEach(function(p){ if (p.city) seen[p.city] = true; });
    var known = CITY_ORDER.filter(function(c){ return seen[c]; });
    var extra = Object.keys(seen).filter(function(c){ return CITY_ORDER.indexOf(c) === -1; }).sort();
    return known.concat(extra);
  }

  /* A hand-picked center where we have one, otherwise the middle of that
     city's own pins — good enough to hang a label off and fly to. */
  function cityCenter(city){
    if (CITY_CENTERS[city]) return CITY_CENTERS[city];
    var pts = (state.places || []).filter(function(p){ return p.city === city; });
    if (!pts.length) return null;
    var lat = 0, lng = 0;
    pts.forEach(function(p){ lat += p.coords.lat; lng += p.coords.lng; });
    return { lat: lat/pts.length, lng: lng/pts.length, dir:'up' };
  }
  var CITY_LABEL_MAX_ZOOM = 6;
  var STATUSES = ['want','booked','visited'];
  var CHINA_BOUNDS = [[15,73],[54,135]];
  var STORAGE_KEY = 'china-reels-map:places:v1';

  /* ============ storage module (swap this for a shared backend later) ============ */
  var Storage = {
    getAll: function(){
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch(e){ return []; }
    },
    saveAll: function(places){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(places));
    },
    upsert: function(place){
      var all = this.getAll();
      var idx = all.findIndex(function(p){ return p.id === place.id; });
      if (idx >= 0) all[idx] = place; else all.push(place);
      this.saveAll(all);
      return all;
    },
    remove: function(id){
      var all = this.getAll().filter(function(p){ return p.id !== id; });
      this.saveAll(all);
      return all;
    },
    exportJSON: function(){
      return JSON.stringify(this.getAll(), null, 2);
    },
    importJSON: function(str){
      var data = JSON.parse(str);
      if (!Array.isArray(data)) throw new Error('Expected a JSON array of places.');
      this.saveAll(data);
      return data;
    },
    seedIfEmpty: function(){
      var self = this;
      if (localStorage.getItem(STORAGE_KEY)) return Promise.resolve(this.getAll());
      return fetch('data/places.json').then(function(res){ return res.json(); })
        .then(function(seed){ self.saveAll(seed); return seed; })
        .catch(function(){ self.saveAll([]); return []; });
    }
  };

  /* ============ state ============ */
  var state = {
    places: [],
    filters: { category:null, city:null, status:null },
    selectedId: null,
    editingId: null,
    tempMarker: null
  };

  /* ============ map setup ============ */
  var map = L.map('map', { zoomControl:false, attributionControl:true }).fitBounds(CHINA_BOUNDS);
  L.control.zoom({ position:'bottomright' }).addTo(map);
  /* Two basemaps, swapped by zoom, because no single keyless tile source
     does both jobs over China:
       - Esri World Street Map romanises place names (Beijing, Chongqing,
         Yellow Sea) which is the whole point of the planning view — but its
         China coverage STOPS at z13, and from about z11 down its minor
         street names go back to Chinese.
       - OSM has the street-level detail and goes to z19, but labels
         everything locally.
     So: English while you're choosing a city, OSM once you're down at a
     venue — which is also the zoom where the address string, not the map,
     is how you actually navigate (see INSTRUCTIONS.md). */
  var ENGLISH_MAX_ZOOM = 13;
  var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  });
  var englishLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: ENGLISH_MAX_ZOOM,
    attribution:'Esri, HERE, Garmin, NGCC, &copy; OpenStreetMap contributors'
  });

  function updateBaseLayer(){
    var wantEnglish = map.getZoom() <= ENGLISH_MAX_ZOOM;
    var add = wantEnglish ? englishLayer : osmLayer;
    var drop = wantEnglish ? osmLayer : englishLayer;
    if (map.hasLayer(add)) return;
    add.addTo(map);
    add.bringToBack();
    if (map.hasLayer(drop)) map.removeLayer(drop);
  }
  updateBaseLayer();
  map.on('zoomend', updateBaseLayer);

  /* Leaflet's trackResize only preserves the CURRENT center/zoom, so a
     fitBounds computed against a half-laid-out container (fonts still
     loading) stays wrong forever, and rotation / iOS URL-bar collapse never
     re-fits. Watch the container instead: revalidate always, re-fit China
     while we're on the idle view (nothing selected, no draft pin). */
  if (window.ResizeObserver){
    new ResizeObserver(function(){
      map.invalidateSize();
      if (!state.selectedId && !state.tempMarker) map.fitBounds(CHINA_BOUNDS);
    }).observe(document.getElementById('map'));
  }

  var markerLayer = L.layerGroup().addTo(map);
  var markersById = {};
  var cityLabelLayer = L.layerGroup().addTo(map);

  function renderCityLabels(){
    cityLabelLayer.clearLayers();
    cities().forEach(function(city){
      var c = cityCenter(city);
      if (!c) return;
      var active = state.filters.city === city;
      var icon = L.divIcon({
        className:'city-label-icon',
        html:'<div class="city-tag dir-' + (c.dir || 'up') + (active ? ' active' : '') + '">' + city.toUpperCase() + '</div>',
        iconSize:[0,0],
        iconAnchor:[0,0]
      });
      var m = L.marker([c.lat, c.lng], { icon:icon, interactive:true, keyboard:false });
      m.on('click', function(cityName, center){
        return function(){
          state.filters.city = cityName;
          refreshAll();
          map.flyTo([center.lat, center.lng], 11, { duration:1.1 });
        };
      }(city, c));
      m.addTo(cityLabelLayer);
    });
  }

  /* City tags and place pins swap over at the same threshold: zoomed out you
     get one tag per city and nothing else, and the dots only appear once
     you've zoomed past the tag. Sahel's call — it replaces the original
     "pins at country zoom for aesthetics" idea, which just read as clutter. */
  function updateZoomLayers(){
    var wide = map.getZoom() <= CITY_LABEL_MAX_ZOOM;
    toggleLayer(cityLabelLayer, wide);
    toggleLayer(markerLayer, !wide);
  }
  function toggleLayer(layer, show){
    if (show === map.hasLayer(layer)) return;
    if (show) layer.addTo(map); else map.removeLayer(layer);
  }
  map.on('zoomend', updateZoomLayers);

  function pinDivIcon(categoryId, selected){
    var cat = CATEGORY_MAP[categoryId] || CATEGORY_MAP.other;
    var cls = 'pin-shape shape-' + cat.shape + (selected ? ' is-selected' : '');
    return L.divIcon({
      className:'pin-icon',
      html:'<div class="' + cls + '"></div>',
      iconSize:[22,22],
      iconAnchor:[11,11]
    });
  }

  function renderPins(){
    markerLayer.clearLayers();
    markersById = {};
    getFilteredPlaces().forEach(function(p){
      var m = L.marker([p.coords.lat, p.coords.lng], {
        icon: pinDivIcon(p.category, p.id === state.selectedId)
      });
      m.on('click', function(){ selectPlace(p.id); });
      m.addTo(markerLayer);
      markersById[p.id] = m;
    });
  }

  function flyToPlace(p){
    map.flyTo([p.coords.lat, p.coords.lng], 14, { duration:1.1 });
  }

  function resetToChina(){
    state.selectedId = null;
    state.filters = { category:null, city:null, status:null };
    hideInfoCard();
    refreshAll();
    map.flyToBounds(CHINA_BOUNDS, { duration:1.0 });
  }

  /* ============ filtering ============ */
  function getFilteredPlaces(){
    return state.places.filter(function(p){
      if (state.filters.category && p.category !== state.filters.category) return false;
      if (state.filters.city && p.city !== state.filters.city) return false;
      if (state.filters.status && p.status !== state.filters.status) return false;
      return true;
    });
  }

  /* ============ rendering: filter chips ============ */
  function shapeSwatchHTML(shape){
    return '<span class="fshape shape-' + shape + '"></span>';
  }

  function renderFilterChips(){
    var catWrap = document.getElementById('categoryFilters');
    catWrap.innerHTML = '';
    catWrap.appendChild(makeChip('All', !state.filters.category, function(){
      state.filters.category = null; refreshAll();
    }));
    CATEGORIES.forEach(function(c){
      var chip = makeChip(c.label, state.filters.category === c.id, function(){
        state.filters.category = (state.filters.category === c.id) ? null : c.id;
        refreshAll();
      }, c.shape);
      catWrap.appendChild(chip);
    });

    var cityWrap = document.getElementById('cityFilters');
    cityWrap.innerHTML = '';
    cityWrap.appendChild(makeChip('All Cities', !state.filters.city, function(){
      state.filters.city = null; refreshAll();
    }));
    cities().forEach(function(city){
      cityWrap.appendChild(makeChip(city, state.filters.city === city, function(){
        state.filters.city = (state.filters.city === city) ? null : city;
        refreshAll();
      }));
    });

    var statusWrap = document.getElementById('statusFilters');
    statusWrap.innerHTML = '';
    statusWrap.appendChild(makeChip('All Status', !state.filters.status, function(){
      state.filters.status = null; refreshAll();
    }));
    STATUSES.forEach(function(s){
      statusWrap.appendChild(makeChip(s, state.filters.status === s, function(){
        state.filters.status = (state.filters.status === s) ? null : s;
        refreshAll();
      }));
    });
  }

  function makeChip(label, on, onClick, shape){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'filter-chip' + (on ? ' on' : '');
    btn.innerHTML = (shape ? shapeSwatchHTML(shape) : '') + label.toUpperCase();
    btn.addEventListener('click', onClick);
    return btn;
  }

  /* ============ rendering: list ============ */
  function renderList(){
    var list = document.getElementById('placeList');
    var filtered = getFilteredPlaces();
    document.getElementById('placeCount').textContent = filtered.length + (filtered.length === 1 ? ' stop' : ' stops');
    list.innerHTML = '';
    if (!filtered.length){
      var note = document.createElement('p');
      note.className = 'empty-note';
      note.textContent = 'Nothing here yet. Paste a link or punch a new ticket to add a place.';
      list.appendChild(note);
      return;
    }

    var groups = {};
    var extraOrder = [];
    filtered.forEach(function(p){
      var city = p.city || 'Other';
      if (!groups[city]){ groups[city] = []; if (CITY_ORDER.indexOf(city) === -1) extraOrder.push(city); }
      groups[city].push(p);
    });
    var cityOrder = CITY_ORDER.filter(function(c){ return groups[c]; }).concat(extraOrder);

    cityOrder.forEach(function(city){
      var head = document.createElement('div');
      head.className = 'list-group-head';
      head.textContent = city + ' · ' + groups[city].length;
      list.appendChild(head);

      groups[city].forEach(function(p){
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'place-card' + (p.id === state.selectedId ? ' selected' : '');
        card.dataset.id = p.id;
        card.style.borderLeftColor = (p.id === state.selectedId) ? '#e8b923' : '#20140f';
        card.innerHTML =
          '<p class="pname">' + escapeHTML(p.name) + '</p>' +
          '<p class="pmeta">' + escapeHTML(CATEGORY_MAP[p.category] ? CATEGORY_MAP[p.category].label : p.category) + '</p>';
        card.addEventListener('click', function(){
          selectPlace(p.id);
          closeMobileSidebarSoon();
        });
        list.appendChild(card);
      });
    });
  }

  function highlightSelectedCard(){
    document.querySelectorAll('.place-card').forEach(function(card){
      var sel = card.dataset.id === state.selectedId;
      card.classList.toggle('selected', sel);
      card.style.borderLeftColor = sel ? '#e8b923' : '#20140f';
    });
  }

  /* ============ info card ============ */
  function selectPlace(id, opts){
    state.selectedId = id;
    var p = state.places.find(function(x){ return x.id === id; });
    if (!p) return;
    renderPins();
    highlightSelectedCard();
    showInfoCard(p);
    if (!opts || opts.fly !== false) flyToPlace(p);
  }

  function showInfoCard(p){
    var card = document.getElementById('infoCard');
    document.getElementById('ic_name').textContent = p.name;
    document.getElementById('ic_local').textContent = p.nameLocal ? (p.nameLocal + ' · ' + p.city) : p.city;

    var tagsWrap = document.getElementById('ic_tags');
    var cat = CATEGORY_MAP[p.category] || CATEGORY_MAP.other;
    tagsWrap.innerHTML =
      '<span class="tag">' + escapeHTML(cat.label) + '</span>' +
      '<span class="tag status-' + p.status + '">' + escapeHTML(p.status) + '</span>';

    document.getElementById('ic_notes').textContent = p.notes || '';
    document.getElementById('ic_notes').style.display = p.notes ? '' : 'none';

    var tagline = document.getElementById('ic_taglist');
    tagline.innerHTML = '';
    (p.tags || []).forEach(function(t){
      var el = document.createElement('span');
      el.className = 'microtag';
      el.textContent = t;
      tagline.appendChild(el);
    });

    var srcLink = document.getElementById('ic_source');
    if (p.source && p.source.url){
      srcLink.href = p.source.url;
      srcLink.textContent = '▶ open source' + (p.source.platform ? ' (' + p.source.platform + ')' : '');
      srcLink.style.display = '';
    } else if (p.source && p.source.platform === 'manual') {
      srcLink.removeAttribute('href');
      srcLink.textContent = '✎ seeded from itinerary';
      srcLink.style.display = '';
    } else {
      srcLink.removeAttribute('href');
      srcLink.style.display = 'none';
    }

    document.getElementById('ic_address').textContent = p.address || '(no address on file)';
    document.getElementById('ic_amap').href = amapUrl(p);

    card.hidden = false;
  }

  function hideInfoCard(){
    document.getElementById('infoCard').hidden = true;
  }

  function amapUrl(p){
    return 'https://uri.amap.com/marker?position=' + p.coords.lng + ',' + p.coords.lat +
      '&name=' + encodeURIComponent(p.name) + '&coordinate=wgs84&callnative=0';
  }

  /* ============ toast ============ */
  var toastTimer = null;
  function toast(msg, ms){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, ms || 1800);
  }

  /* Adding the first place in a new city changes two things the user is
     looking straight past: the city's filter chip appears past the right
     edge of the (horizontally scrollable) filter row, and its map label
     only draws at the whole-trip zoom — while the save has just flown the
     map to z14. Without this, adding a city looks like nothing happened. */
  function revealCityChip(city){
    var chips = document.querySelectorAll('#cityFilters button');
    for (var i = 0; i < chips.length; i++){
      if (chips[i].textContent.trim().toUpperCase() === city.toUpperCase()){
        chips[i].scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });
        return;
      }
    }
  }

  /* ============ add / edit form ============ */
  function populateSelects(){
    var catSel = document.getElementById('f_category');
    catSel.innerHTML = CATEGORIES.map(function(c){ return '<option value="' + c.id + '">' + c.label + '</option>'; }).join('');
    renderCityOptions();
  }

  function slugify(str){
    return (str || '').toLowerCase().trim()
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/(^-|-$)/g,'') || 'place';
  }

  function makeId(name){
    var existing = new Set(state.places.map(function(p){ return p.id; }));
    var base = slugify(name);
    var id = base, i = 2;
    while (existing.has(id)) { id = base + '-' + (i++); }
    return id;
  }

  function escapeHTML(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function clearTempMarker(){
    if (state.tempMarker){ map.removeLayer(state.tempMarker); state.tempMarker = null; }
  }

  function dropTempMarker(lat, lng){
    clearTempMarker();
    state.tempMarker = L.marker([lat,lng], {
      draggable:true,
      icon: L.divIcon({ className:'pin-icon', html:'<div class="temp-pin"></div>', iconSize:[22,22], iconAnchor:[11,11] })
    }).addTo(map);
    map.flyTo([lat,lng], 14, { duration:0.9 });
  }

  function openAddForm(prefill){
    state.editingId = null;
    hideInfoCard();
    document.getElementById('formHead').hidden = false;
    document.getElementById('addForm').hidden = false;
    document.getElementById('placeList').hidden = true;
    document.getElementById('listHead').hidden = true;
    document.getElementById('deleteBtn').hidden = true;
    document.getElementById('saveBtn').textContent = 'Stamp it';

    var form = document.getElementById('addForm');
    form.reset();
    document.getElementById('geoResults').innerHTML = '';
    document.getElementById('geoStatus').textContent = '';
    clearTempMarker();

    if (prefill){
      if (prefill.url) document.getElementById('f_source').value = prefill.url;
      if (prefill.name){
        document.getElementById('f_name').value = prefill.name;
        document.getElementById('f_locate').value = prefill.name;
      }
    }
    openSidebarMobile();
  }

  function openEditForm(place){
    state.editingId = place.id;
    hideInfoCard();
    document.getElementById('formHead').hidden = false;
    document.getElementById('addForm').hidden = false;
    document.getElementById('placeList').hidden = true;
    document.getElementById('listHead').hidden = true;
    document.getElementById('deleteBtn').hidden = false;
    document.getElementById('saveBtn').textContent = 'Save changes';

    document.getElementById('f_source').value = (place.source && place.source.url) || '';
    document.getElementById('f_name').value = place.name || '';
    document.getElementById('f_locate').value = place.name || '';
    document.getElementById('f_nameLocal').value = place.nameLocal || '';
    document.getElementById('f_category').value = place.category;
    document.getElementById('f_city').value = place.city;
    document.getElementById('f_status').value = place.status;
    document.getElementById('f_address').value = place.address || '';
    document.getElementById('f_notes').value = place.notes || '';
    document.getElementById('f_tags').value = (place.tags || []).join(', ');
    document.getElementById('geoResults').innerHTML = '';
    document.getElementById('geoStatus').textContent = '';

    dropTempMarker(place.coords.lat, place.coords.lng);
    openSidebarMobile();
  }

  function closeForm(){
    document.getElementById('formHead').hidden = true;
    document.getElementById('addForm').hidden = true;
    document.getElementById('placeList').hidden = false;
    document.getElementById('listHead').hidden = false;
    clearTempMarker();
    state.editingId = null;
  }

  function isUrl(str){
    return /^https?:\/\//i.test((str || '').trim());
  }

  /* ---- geocoding ---- */
  var lastGeoAt = 0;
  function geocode(query){
    var statusEl = document.getElementById('geoStatus');
    var resultsEl = document.getElementById('geoResults');
    var now = Date.now();
    var wait = Math.max(0, 1100 - (now - lastGeoAt));
    statusEl.textContent = 'Searching…';
    resultsEl.innerHTML = '';
    setTimeout(function(){
      lastGeoAt = Date.now();
      var url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&namedetails=1&extratags=1&limit=5&countrycodes=cn&q=' + encodeURIComponent(query);
      fetch(url).then(function(res){
        if (!res.ok) throw new Error('geocoding failed');
        return res.json();
      }).then(function(results){
        if (!results.length){
          statusEl.textContent = 'No matches — try a more specific name, or drop the pin manually by editing the address.';
          return;
        }
        statusEl.textContent = results.length + ' match(es) — pick one:';
        results.forEach(function(r){
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'geo-result';
          btn.textContent = r.display_name;
          btn.addEventListener('click', function(){
            pickGeoResult(r);
            resultsEl.innerHTML = '';
          });
          resultsEl.appendChild(btn);
        });
      }).catch(function(){
        statusEl.textContent = 'Geocoding failed — check your connection, or drop the pin manually.';
      });
    }, wait);
  }

  /* ---- auto-fill from a picked geocode result ---- */
  var CATEGORY_TYPE_MAP = {
    restaurant:'food', fast_food:'food', food_court:'food',
    cafe:'cafe', coffee_shop:'cafe',
    bar:'bar', pub:'bar', nightclub:'bar', biergarten:'bar',
    mall:'shopping', marketplace:'shopping', department_store:'shopping', supermarket:'shopping',
    park:'nature', nature_reserve:'nature', peak:'nature', viewpoint:'nature', wood:'nature', beach:'nature', garden:'nature',
    attraction:'sight', museum:'sight', artwork:'sight', zoo:'sight', theme_park:'sight', gallery:'sight', temple:'sight', castle:'sight', monument:'sight'
  };
  function inferCategory(result){
    var byType = CATEGORY_TYPE_MAP[(result.type || '').toLowerCase()];
    if (byType) return byType;
    var cls = (result.class || '').toLowerCase();
    if (cls === 'shop') return 'shopping';
    if (cls === 'natural' || cls === 'leisure') return 'nature';
    if (cls === 'tourism' || cls === 'historic') return 'sight';
    return null;
  }

  var CITY_ALIASES = {
    Shanghai: ['shanghai'],
    Chongqing: ['chongqing','chengdu'],
    Zhangjiajie: ['zhangjiajie','furong','yongshun','wulingyuan'],
    Beijing: ['beijing'],
    "Xi'an": ["xi'an", 'xian', '西安']
  };
  function inferCity(result){
    var hay = (result.display_name || '').toLowerCase();
    for (var city in CITY_ALIASES){
      var aliases = CITY_ALIASES[city];
      for (var i = 0; i < aliases.length; i++){
        if (hay.indexOf(aliases[i]) !== -1) return city;
      }
    }
    /* No alias hit — take Nominatim's own answer (addressdetails=1 is already
       on the query). That's what makes a brand-new city like Xi'an fill itself
       in without anyone adding it to a list first. */
    var a = result.address || {};
    return a.city || a.town || a.municipality || a.county || a.state || null;
  }

  function pickGeoResult(r){
    var statusEl = document.getElementById('geoStatus');
    dropTempMarker(parseFloat(r.lat), parseFloat(r.lon));
    document.getElementById('f_address').value = r.display_name;

    var nameEl = document.getElementById('f_name');
    var localEl = document.getElementById('f_nameLocal');
    var nd = r.namedetails || {};
    if (!nameEl.value.trim()) nameEl.value = nd['name:en'] || nd.name || r.name || nameEl.value;
    if (!localEl.value.trim() && nd['name:zh']) localEl.value = nd['name:zh'];

    var inferred = inferCategory(r);
    if (inferred) document.getElementById('f_category').value = inferred;

    var cityGuess = inferCity(r);
    if (cityGuess) document.getElementById('f_city').value = cityGuess;

    var tagsEl = document.getElementById('f_tags');
    if (!tagsEl.value.trim() && r.type){
      tagsEl.value = r.type.replace(/_/g,' ');
    }

    statusEl.textContent = 'Pin dropped — drag it on the map if it needs a nudge. Looking for a blurb…';
    fetchWikiBlurb(nameEl.value.trim(), function(extract){
      var notesEl = document.getElementById('f_notes');
      if (notesEl.value.trim()){
        statusEl.textContent = 'Pin dropped — drag it on the map if it needs a nudge.';
        return;
      }
      if (extract){
        notesEl.value = extract;
        statusEl.textContent = 'Pin dropped, and found a Wikipedia blurb — edit it however you like.';
      } else {
        notesEl.value = fallbackBlurb(r, cityGuess);
        statusEl.textContent = 'Pin dropped — no Wikipedia page for this one, so I put together a quick line from the map data. Edit away.';
      }
    });
  }

  function fetchWikiBlurb(title, cb){
    if (!title){ cb(null); return; }
    fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title))
      .then(function(res){ if (!res.ok) throw new Error('no article'); return res.json(); })
      .then(function(data){
        if (data && data.extract && !/may refer to/i.test(data.extract)) cb(data.extract);
        else cb(null);
      })
      .catch(function(){ cb(null); });
  }

  function fallbackBlurb(result, cityGuess){
    var type = (result.type || result.class || 'place').replace(/_/g,' ');
    var bits = ['A ' + type + (cityGuess ? ' in ' + cityGuess : '') + '.'];
    var extra = result.extratags || {};
    if (extra.cuisine) bits.push('Cuisine: ' + extra.cuisine.replace(/_/g,', ') + '.');
    if (extra.brand) bits.push('Part of ' + extra.brand + '.');
    if (extra.opening_hours) bits.push('Hours: ' + extra.opening_hours + '.');
    return bits.join(' ');
  }

  /* ============ event wiring ============ */
  document.getElementById('openAddBtn').addEventListener('click', function(){
    var raw = document.getElementById('quickPaste').value.trim();
    var prefill = {};
    if (raw){
      if (isUrl(raw)) prefill.url = raw; else prefill.name = raw;
    }
    openAddForm(prefill);
  });
  document.getElementById('mobileAddBtn').addEventListener('click', function(){ openAddForm(); });
  document.getElementById('backToListBtn').addEventListener('click', closeForm);

  document.getElementById('locateBtn').addEventListener('click', function(){
    var q = document.getElementById('f_locate').value.trim() || document.getElementById('f_name').value.trim();
    if (!q){ document.getElementById('geoStatus').textContent = 'Type a place name first.'; return; }
    var city = document.getElementById('f_city').value;
    geocode(q + (city ? ', ' + city : '') + ', China');
  });

  document.getElementById('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('f_name').value.trim();
    if (!name){ toast('Give it a name first.'); return; }
    if (!state.tempMarker){ toast('Locate it on the map first (or drag a pin).'); return; }
    /* Trimmed because it's free text now — "Xi'an " would otherwise become a
       second city sitting next to "Xi'an", with its own chip and label. */
    var city = document.getElementById('f_city').value.trim();
    if (!city){ toast('Which city? Type one — a new name is fine.'); return; }
    var citiesBefore = cities();
    var pos = state.tempMarker.getLatLng();
    var tags = document.getElementById('f_tags').value.split(',').map(function(t){ return t.trim(); }).filter(Boolean);
    var sourceUrl = document.getElementById('f_source').value.trim();

    var place = {
      id: state.editingId || makeId(name),
      name: name,
      nameLocal: document.getElementById('f_nameLocal').value.trim(),
      category: document.getElementById('f_category').value,
      city: city,
      coords: { lat: pos.lat, lng: pos.lng, datum: 'WGS84' },
      address: document.getElementById('f_address').value.trim(),
      source: { platform: sourceUrl ? 'link' : 'typed', url: sourceUrl, creator:'' },
      notes: document.getElementById('f_notes').value.trim(),
      tags: tags,
      status: document.getElementById('f_status').value,
      addedAt: new Date().toISOString().slice(0,10)
    };

    var isNewCity = citiesBefore.indexOf(city) === -1;
    state.places = Storage.upsert(place);
    closeForm();
    refreshAll();
    selectPlace(place.id);
    if (isNewCity){
      revealCityChip(city);
      toast(city + ' is on the map now — tap "Whole trip" to see it.', 3600);
    } else {
      toast(state.editingId ? 'Updated.' : 'Pinned it.');
    }
    document.getElementById('quickPaste').value = '';
  });

  document.getElementById('deleteBtn').addEventListener('click', function(){
    if (!state.editingId) return;
    if (!confirm('Remove this place from the map?')) return;
    state.places = Storage.remove(state.editingId);
    closeForm();
    resetToChina();
    refreshAll();
    toast('Removed.');
  });

  document.getElementById('ic_edit').addEventListener('click', function(){
    var p = state.places.find(function(x){ return x.id === state.selectedId; });
    if (p) openEditForm(p);
  });

  document.getElementById('closeInfoBtn').addEventListener('click', function(){
    state.selectedId = null;
    hideInfoCard();
    renderPins();
    highlightSelectedCard();
  });

  document.getElementById('ic_copy').addEventListener('click', function(){
    var text = document.getElementById('ic_address').textContent;
    navigator.clipboard.writeText(text).then(function(){
      var btn = document.getElementById('ic_copy');
      btn.classList.add('copied');
      btn.textContent = 'Copied ✓';
      setTimeout(function(){ btn.classList.remove('copied'); btn.textContent = 'Copy address'; }, 1400);
    }).catch(function(){ toast('Could not copy — select and copy manually.'); });
  });

  document.getElementById('resetViewBtn').addEventListener('click', resetToChina);

  /* ---- export / import menu ---- */
  var menuDropdown = document.getElementById('menuDropdown');
  document.getElementById('menuBtn').addEventListener('click', function(e){
    e.stopPropagation();
    menuDropdown.hidden = !menuDropdown.hidden;
  });
  document.addEventListener('click', function(){ menuDropdown.hidden = true; });
  menuDropdown.addEventListener('click', function(e){ e.stopPropagation(); });

  document.getElementById('exportBtn').addEventListener('click', function(){
    var blob = new Blob([Storage.exportJSON()], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'china-reels-map-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    menuDropdown.hidden = true;
    toast('Exported.');
  });
  document.getElementById('importBtn').addEventListener('click', function(){
    menuDropdown.hidden = true;
    document.getElementById('importInput').click();
  });
  document.getElementById('importInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try {
        state.places = Storage.importJSON(reader.result);
        refreshAll();
        resetToChina();
        toast('Imported ' + state.places.length + ' places.');
      } catch(err){
        alert('Could not import: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  /* ---- mobile sidebar toggle ---- */
  function openSidebarMobile(){
    if (window.innerWidth <= 760) document.getElementById('sidebar').classList.add('open');
  }
  function closeMobileSidebarSoon(){
    if (window.innerWidth <= 760){
      setTimeout(function(){ document.getElementById('sidebar').classList.remove('open'); }, 250);
    }
  }
  document.getElementById('mobileListBtn').addEventListener('click', function(){
    document.getElementById('sidebar').classList.toggle('open');
  });

  /* ============ refresh ============ */
  /* Type-ahead for the City field: the trip cities plus anything already in
     the data. It's a datalist, not a select, so a city that's in neither
     (the first place you add in a new city) is still just typed in. */
  function renderCityOptions(){
    var list = CITY_ORDER.concat(cities().filter(function(c){ return CITY_ORDER.indexOf(c) === -1; }));
    document.getElementById('cityOptions').innerHTML =
      list.map(function(c){ return '<option value="' + c.replace(/"/g,'&quot;') + '">'; }).join('');
  }

  function refreshAll(){
    renderCityOptions();
    renderFilterChips();
    renderList();
    renderPins();
    renderCityLabels();
  }

  /* ============ boot ============ */
  populateSelects();
  updateZoomLayers();
  Storage.seedIfEmpty().then(function(places){
    state.places = places;
    refreshAll();
  });

})();
</script>
</body>
</html>
